services:
  frontend:
    networks:
      - dbarena
      - access
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

  backend:
    networks:
      - dbarena
      - access
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  mcp:
    networks:
      - dbarena
      - access
    ports:
      - "127.0.0.1:${MCP_PORT:-8090}:8090"

  admindb:
    networks:
      - dbarena
      - access
    ports:
      - "127.0.0.1:${ADMINDB_PORT:-5433}:5432"

  taskdb:
    networks:
      - dbarena
      - access
    ports:
      - "127.0.0.1:${TASKDB_PORT:-5434}:5432"

networks:
  dbarena:
    internal: true
  access:
    internal: false
